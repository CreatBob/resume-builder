# author: Bob
# Cloudflare Pages 部署与本地预览配置模板
# 生产环境请在 Cloudflare Pages 控制台「Settings -> Functions -> KV namespace bindings」中绑定变量 RESUME_SHARES。
# 切勿把私人 Account ID 或真实 KV Namespace ID 提交至仓库。

name = "resume-builder"
compatibility_date = "2026-05-01"
pages_build_output_dir = "dist"

# 本地 wrangler 联调时可取消下方注释并填写本地预览用途的绑定：
# [[kv_namespaces]]
# binding = "RESUME_SHARES"
# id = "<your-kv-namespace-id>"
